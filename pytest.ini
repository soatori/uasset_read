[pytest]
testpaths = tests
pythonpath = src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: fast checks for core CLI/API behavior
    unit: focused tests for single functions/classes and tool behavior
    assets: tests that require Unreal Engine sample assets
    compat: fixed-seed compatibility sampling
    quality: generated C++ output quality checks
    acceptance: product-goal acceptance tests
    slow: intentionally slow or broad scans
