name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # master 分支文件目录合规检查
  directory-compliance:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.base_ref == 'master'
    steps:
      - uses: actions/checkout@v4

      - name: Check master branch file whitelist
        run: |
          echo "Checking master branch directory compliance..."

          FILES=$(git ls-files)

          # 禁止出现在 master 的目录
          FORBIDDEN_PATTERNS=(
            "^wiki/"
            "^docs/guides/"
            "^docs/superpowers/"
            "^docs/reports/"
            "^scripts/"
            "^temp/"
            "^\.claude/skills/"
            "^\.claude/workflows/"
            "^\.claude/agents/"
          )

          VIOLATIONS=""
          for pattern in "${FORBIDDEN_PATTERNS[@]}"; do
            MATCHES=$(echo "$FILES" | grep -E "$pattern" || true)
            if [ -n "$MATCHES" ]; then
              VIOLATIONS="$VIOLATIONS\n❌ Forbidden: $pattern"
            fi
          done

          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Master branch contains forbidden files:$VIOLATIONS"
            echo ""
            echo "Master 允许的文件："
            echo "  - src/uasset_read/ (核心源码)"
            echo "  - .github/workflows/ (CI)"
            echo "  - README.md, README.zh-CN.md, CLAUDE.md, LICENSE"
            echo "  - pytest.ini, run.py, tests/ (CI 需要)"
            echo "  - .claude/rules/"
            echo "  - docs/formats/, docs/designs/, docs/reference/, docs/agents/, docs/release-notes/"
            exit 1
          fi

          echo "✅ Master branch compliance check passed"

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --cov=uasset_read --cov-report=xml --allow-missing-assets

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
