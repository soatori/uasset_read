name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # master 分支文件目录合规检查
  directory-compliance:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.base_ref == 'master'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check master branch file whitelist
        run: |
          echo "Checking master branch directory compliance..."

          # 对于 PR，只检查相对于 master 分支的新增文件
          # 对于直接 push 到 master，检查所有文件
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # 只检查新增文件（相对于 master 的差异）
            # 但排除那些已经在 develop 分支上存在的目录（它们不应该被合并到 master）
            ALL_ADDED=$(git diff --diff-filter=A --name-only origin/master...HEAD 2>/dev/null || echo "")
            # 获取 develop 分支上已存在的目录
            EXISTING_DIRS=$(git ls-tree -d --name-only HEAD 2>/dev/null || echo "")
            # 过滤掉已经在 develop 分支上存在的目录
            FILES=""
            while IFS= read -r file; do
              if [ -n "$file" ]; then
                dir=$(dirname "$file")
                # 检查这个目录是否在 develop 分支上已经存在
                if ! echo "$EXISTING_DIRS" | grep -q "^${dir}$"; then
                  FILES="$FILES\n$file"
                fi
              fi
            done <<< "$ALL_ADDED"
          else
            FILES=$(git ls-files)
          fi

          # 禁止出现在 master 的目录
          FORBIDDEN_PATTERNS=(
            "^wiki/"
            "^docs/guides/"
            "^docs/superpowers/"
            "^docs/reports/"
            "^scripts/"
            "^temp/"
            "^\.claude/skills/"
            "^\.claude/workflows/"
            "^\.claude/agents/"
            "^docs/mcp-config/"
          )

          VIOLATIONS=""
          for pattern in "${FORBIDDEN_PATTERNS[@]}"; do
            MATCHES=$(echo "$FILES" | grep -E "$pattern" || true)
            if [ -n "$MATCHES" ]; then
              VIOLATIONS="$VIOLATIONS\n❌ Forbidden: $pattern"
            fi
          done

          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Master branch contains forbidden files:$VIOLATIONS"
            echo ""
            echo "Master 允许的文件："
            echo "  - src/uasset_read/ (核心源码)"
            echo "  - .github/workflows/ (CI)"
            echo "  - README.md, README.zh-CN.md, CLAUDE.md, LICENSE"
            echo "  - pytest.ini, run.py, tests/ (CI 需要)"
            echo "  - .claude/rules/"
            echo "  - docs/formats/, docs/designs/, docs/reference/, docs/agents/, docs/release-notes/"
            exit 1
          fi

          echo "✅ Master branch compliance check passed"

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --cov=uasset_read --cov-report=xml -m "not integration and not slow and not regression"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  resource-safety:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install pytest

      - name: Run resource safety tests
        run: |
          python -m pytest tests/core/test_batch_hybrid.py tests/core/test_error_handling_v2.py -v

  ruff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: |
          python -m pip install ruff

      - name: Run Ruff checks
        run: |
          ruff check src/uasset_read --select F821,F841,F811,F541,B023
