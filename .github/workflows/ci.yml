name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  # master 分支文件目录合规检查
  directory-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check master branch file whitelist
        run: |
          echo "Checking master branch directory compliance..."

          # 对于 PR，只检查相对于 master 分支的新增文件
          # 对于直接 push 到 master，检查所有文件
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --diff-filter=A --name-only origin/master...HEAD)
          else
            FILES=$(git ls-files)
          fi

          # 禁止出现在 master 的目录
          FORBIDDEN_PATTERNS=(
            "^wiki/"
            "^docs/guides/"
            "^docs/superpowers/"
            "^docs/reports/"
            "^scripts/"
            "^temp/"
            "^\.claude/workflows/"
            "^\.claude/agents/"
            "^docs/mcp-config/"
          )

          VIOLATIONS=""
          for pattern in "${FORBIDDEN_PATTERNS[@]}"; do
            MATCHES=$(echo "$FILES" | grep -E "$pattern" || true)
            if [ -n "$MATCHES" ]; then
              VIOLATIONS="$VIOLATIONS\n❌ Forbidden: $pattern"
            fi
          done

          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Master branch contains forbidden files:$VIOLATIONS"
            echo ""
            echo "Master 允许的文件："
            echo "  - src/uasset_read/ (核心源码)"
            echo "  - .github/workflows/ (CI)"
            echo "  - README.md, README.zh-CN.md, CLAUDE.md, LICENSE"
            echo "  - pytest.ini, tests/ (CI 需要)"
            echo "  - .claude/rules/"
            echo "  - docs/formats/, docs/designs/, docs/reference/"
            exit 1
          fi

          echo "✅ Master branch compliance check passed"

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build

      - name: Install and import wheel outside checkout
        run: |
          python -m pip install dist/*.whl
          cd "$(mktemp -d)"
          python -c "import uasset_read"

      - name: Check wheel size against baseline
        run: |
          python - <<'PY'
          import json, pathlib, sys

          raw = pathlib.Path("tests/size-baseline.json").read_text("utf-8")
          limit = json.loads(raw)["wheel_bytes"]["max_bytes"]
          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          if not wheels:
              print("::error::no wheel found under dist/")
              sys.exit(1)
          size = max(w.stat().st_size for w in wheels)
          report = "wheel=%d baseline=%d" % (size, limit)
          if size > limit:
              print("::error::over wheel size baseline: " + report)
              print("::error::raise wheel_bytes.max_bytes to accept")
              sys.exit(1)
          print("wheel size ok: " + report)
          PY

  ruff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: |
          python -m pip install ruff

      - name: Run Ruff checks
        run: |
          ruff check src/uasset_read tests/

  # 类型门禁：审计发现 54 个类型错误在无人察觉的情况下累积，因为 CI 从不跑 Pyright。
  pyright-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pyright
        run: |
          python -m pip install pyright

      - name: Run Pyright
        run: |
          pyright src/uasset_read

  # peer 佐证措辞门禁（方案 §3 规则 1/4）：只扫 src/ ——文档里必然要引用被禁的字符串本身。
  peer-evidence-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check peer corroboration wording
        run: |
          python - <<'PY'
          import pathlib, re, sys

          banned = re.compile(r"corroborated by peers", re.I)
          marker = re.compile(r"Corroborated \(not proof\)\s*:", re.I)
          inventory = pathlib.Path("docs/reference/external-peer-inventory.md")
          if not inventory.exists():
              print("::error::peer inventory missing")
              sys.exit(1)
          ROW = re.compile(
              r"^\| ([A-Za-z0-9._+-]+) \| [^|]* \| `([0-9a-f]{7,})` \|",
              re.M,
          )
          raw = inventory.read_text(encoding="utf-8")
          rows = ROW.findall(raw)
          peers = sorted({name for name, commit in rows if commit})
          # 边界匹配：子串匹配会让 TotallyFakePeer 命中表头误收的 "Peer"。
          peer_re = [
              re.compile(rf"(?<![A-Za-z0-9]){re.escape(p)}(?![A-Za-z0-9])")
              for p in peers
          ]
          failed = 0
          for path in sorted(pathlib.Path("src").rglob("*.py")):
              text = path.read_text(encoding="utf-8")
              for hit in banned.finditer(text):
                  line = text[: hit.start()].count("\n") + 1
                  print(f"::error::{path}:{line}: banned wording; "
                        f"name each peer with its symbol")
                  failed = 1
              for hit in marker.finditer(text):
                  window = text[hit.end() : hit.end() + 160]
                  if not any(r.search(window) for r in peer_re):
                      line = text[: hit.start()].count("\n") + 1
                      print(f"::error::{path}:{line}: marker names no "
                            f"peer from the inventory")
                      failed = 1
          sys.exit(failed)
          PY

  pytest-smoke:
    runs-on: ubuntu-latest
    needs: [ruff-check, pyright-check, peer-evidence-hygiene]
    # non-blocking smoke evidence; blocking gate is local Windows + 3.14
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install . jsonschema pytest
      - name: Run full fast suite
        run: |
          python -m pytest -q
