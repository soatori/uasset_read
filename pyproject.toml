[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uasset-read"
dynamic = ["version"]
description = "虚幻引擎 .uasset 文件的 Python 解析器，零运行时依赖"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["unreal-engine", "uasset", "parser", "blueprint"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/soatori/uasset_read"
Repository = "https://github.com/soatori/uasset_read"
Issues = "https://github.com/soatori/uasset_read/issues"

[project.optional-dependencies]
compression = [
    "brotli",
    "lz4",
    "zstandard",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["F821", "F841", "F811", "F541", "B023"]

[tool.setuptools.dynamic]
version = {attr = "uasset_read.__version__"}
